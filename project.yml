name: mdNotch
options:
  bundleIdPrefix: com.akeuuh
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  MdNotchCore:
    path: Core
targets:
  mdNotch:
    type: application
    platform: macOS
    sources:
      - App/Sources
      # String Catalog (EN base + FR) and the app icon
      # (generated by scripts/icon/gen_icon.swift).
      - path: App/Resources
        buildPhase: resources
      # Frozen markitdown binary (built by scripts/freeze-markitdown/build.sh),
      # copied as a folder reference into Resources/markitdown-bin/.
      - path: scripts/freeze-markitdown/dist/markitdown-bin
        type: folder
        buildPhase: resources
    dependencies:
      - package: MdNotchCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: mdNotch
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "0.2.1"
        CFBundleVersion: "3"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akeuuh.mdNotch
        ARCHS: arm64
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: true
